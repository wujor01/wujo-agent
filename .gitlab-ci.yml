# Deploy trang agent.wujo.dev lên Cloudflare Workers.
# Chỉ chạy trên master khi commit message có chữ "deploy", hoặc khi bấm chạy tay.
# Biến CI cần có: CLOUDFLARE_API_TOKEN (Workers + R2 edit), CLOUDFLARE_ACCOUNT_ID.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_MESSAGE =~ /deploy/i
    - if: $CI_PIPELINE_SOURCE == "web"

image: node:22-bookworm-slim

stages: [test, deploy]

test-server:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - cd server && npm ci --no-audit --no-fund
    - npm test

deploy-landing:
  stage: deploy
  environment: { name: landing, url: https://agent.wujo.dev }
  script:
    # Bản web của app đi kèm trong gói server mà trang chủ cho tải.
    - cd app && npm ci --no-audit --no-fund && npm run typecheck && npm run build:web && cd ..
    - cd deploy/cloudflare && npm ci --no-audit --no-fund
    - npm run deploy
